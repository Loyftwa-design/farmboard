name: Build Farmboard release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged version
        uses: actions/checkout@v4

      - name: Build install-ready addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/Farmboard/Media dist

          cp FarmboardStorage.lua build/Farmboard/FarmboardStorage.lua
          cp Farmboard.lua build/Farmboard/Farmboard.lua
          cp Farmboard.toc build/Farmboard/Farmboard.toc
          cp README.md build/Farmboard/README.txt
          cp CHANGELOG.md build/Farmboard/CHANGELOG.txt
          cp Media/CompleteTriangle.tga build/Farmboard/Media/CompleteTriangle.tga
          cp Media/FarmboardMinimapIcon.tga build/Farmboard/Media/FarmboardMinimapIcon.tga
          cp Media/GoalComplete.ogg build/Farmboard/Media/GoalComplete.ogg

          cd build
          zip -r "../dist/Farmboard-${GITHUB_REF_NAME}.zip" Farmboard
          cd ..
          unzip -t "dist/Farmboard-${GITHUB_REF_NAME}.zip"
          sha256sum "dist/Farmboard-${GITHUB_REF_NAME}.zip" > "dist/Farmboard-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/Farmboard-${GITHUB_REF_NAME}.zip" \
            "dist/Farmboard-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Farmboard ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
