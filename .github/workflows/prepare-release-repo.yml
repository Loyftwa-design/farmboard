name: Prepare Farmboard release repository

on:
  push:
    branches: [main]
    paths:
      - '.repo-assets/**'
      - 'farmboard_screenshots.zip'
      - '.github/workflows/prepare-release-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether release staging files exist
        id: staged
        shell: bash
        run: |
          if compgen -G '.repo-assets/Farmboard-v1.0.0.zip.b64.*' > /dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and validate release package
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/farmboard-release
          cat .repo-assets/Farmboard-v1.0.0.zip.b64.* > /tmp/farmboard-v1.0.0.b64
          base64 --decode /tmp/farmboard-v1.0.0.b64 > dist/Farmboard-v1.0.0.zip
          unzip -t dist/Farmboard-v1.0.0.zip
          unzip -q -o dist/Farmboard-v1.0.0.zip -d /tmp/farmboard-release
          test -f /tmp/farmboard-release/Farmboard/Farmboard.lua
          test -f /tmp/farmboard-release/Farmboard/Farmboard.toc
          test -f /tmp/farmboard-release/Farmboard/Media/CompleteTriangle.tga
          test -f /tmp/farmboard-release/Farmboard/Media/FarmboardMinimapIcon.tga
          test -f /tmp/farmboard-release/Farmboard/Media/GoalComplete.ogg

      - name: Sync installable addon source
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/farmboard-release/Farmboard/Farmboard.lua Farmboard.lua
          cp /tmp/farmboard-release/Farmboard/Farmboard.toc Farmboard.toc
          rm -rf Media
          mkdir -p Media
          cp /tmp/farmboard-release/Farmboard/Media/CompleteTriangle.tga Media/CompleteTriangle.tga
          cp /tmp/farmboard-release/Farmboard/Media/FarmboardMinimapIcon.tga Media/FarmboardMinimapIcon.tga
          cp /tmp/farmboard-release/Farmboard/Media/GoalComplete.ogg Media/GoalComplete.ogg

      - name: Extract screenshots for README
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f farmboard_screenshots.zip ]; then
            rm -rf docs/images
            mkdir -p docs/images
            unzip -jo farmboard_screenshots.zip '*.png' -d docs/images
          fi

      - name: Remove staging files
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .repo-assets
          rm -f farmboard_screenshots.zip

      - name: Commit prepared repository
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare Farmboard v1.0.0 release repository'
            git push origin main
          fi

      - name: Create GitHub Release v1.0.0
        if: steps.staged.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/Farmboard-v1.0.0.zip --clobber
          else
            gh release create v1.0.0 dist/Farmboard-v1.0.0.zip \
              --title 'Farmboard v1.0.0' \
              --notes-file CHANGELOG.md \
              --target "$(git rev-parse HEAD)"
          fi
